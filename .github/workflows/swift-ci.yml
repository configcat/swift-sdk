name: Swift CI

on:
  schedule:
    - cron: "0 8 * * 1"
  push:
    branches: ["*"]
    paths-ignore:
      - "**.md"
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [master]

  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app

jobs:
  test-ios:
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - destination: platform=iOS Simulator,name=iPhone SE (3rd generation),OS=18.5
            platform: iphone
          - destination: platform=tvOS Simulator,name=Apple TV
            platform: appletv
          - destination: platform=watchOS Simulator,name=Apple Watch Series 10 (46mm),OS=11.5
            platform: watch
          - destination: platform=visionOS Simulator,name=Apple Vision Pro,OS=2.5
            platform: watch
    steps:
      - uses: actions/checkout@v7
      - name: Start CoreSimulator
        run: xcrun simctl list devices available
      - name: Tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project ConfigCat.xcodeproj -scheme "ConfigCat" -destination "${{ matrix.destination }}" CODE_SIGNING_REQUIRED=NO -quiet
          xcodebuild test-without-building -project ConfigCat.xcodeproj -scheme "ConfigCat" -destination "${{ matrix.destination }}" CODE_SIGNING_REQUIRED=NO -resultBundlePath tests/${{ matrix.platform }}.xcresult
      - name: Archive results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests

  test-osx:
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - sdk: macosx15.5
            destination: arch=x86_64
            platform: macos
    steps:
      - uses: actions/checkout@v7
      - name: Tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing -sdk ${{ matrix.sdk }} -project ConfigCat.xcodeproj -scheme "ConfigCat" -destination "${{ matrix.destination }}" -quiet
          xcodebuild test-without-building -sdk ${{ matrix.sdk }} -project ConfigCat.xcodeproj -scheme "ConfigCat" -destination "${{ matrix.destination }}" -resultBundlePath tests/${{ matrix.platform }}.xcresult
      - name: Archive results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests

  test-swift-6:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build SDK in Swift 6 mode
        run: swift build -Xswiftc -swift-version -Xswiftc 6
      - name: Type-check Swift 6 client
        run: |
          swift build
          bin_path="$(swift build --show-bin-path)"
          swiftc -swift-version 6 -strict-concurrency=complete -warnings-as-errors \
            -typecheck -I "$bin_path" -I "$bin_path/Modules" Tests/Swift6Concurrency/Client.swift
          diagnostics="$(mktemp)"
          trap 'rm -f "$diagnostics"' EXIT
          check_negative() {
            local label="$1"
            shift
            if swiftc -swift-version 6 -strict-concurrency=complete \
              -typecheck -I "$bin_path" -I "$bin_path/Modules" "$@" \
              Tests/Swift6Concurrency/Client.swift >"$diagnostics" 2>&1; then
              severity=warning
            else
              severity=error
            fi
            if ! grep -qi "$severity:.*actor-isolated property 'count'" "$diagnostics"; then
              echo "Expected $label to emit a Swift 6 actor-isolation $severity"
              cat "$diagnostics"
              exit 1
            fi
            if grep -i "error:" "$diagnostics" | grep -vi "error:.*actor-isolated property 'count'"; then
              echo "Unexpected errors while checking $label"
              cat "$diagnostics"
              exit 1
            fi
            echo "$label: verified actor-isolation $severity"
          }
          for flag in NEGATIVE_READY NEGATIVE_FLAG_EVALUATED NEGATIVE_CONFIG_CHANGED NEGATIVE_ERROR; do
            check_negative "$flag" -D "$flag"
          done
          for flag in \
            NEGATIVE_GET_VALUE NEGATIVE_GET_VALUE_DETAILS \
            NEGATIVE_GET_ALL_VALUES NEGATIVE_GET_ALL_VALUE_DETAILS \
            NEGATIVE_GET_ALL_VALUES_OBJC NEGATIVE_GET_ALL_VALUE_DETAILS_OBJC \
            NEGATIVE_GET_ALL_KEYS NEGATIVE_GET_KEY_AND_VALUE NEGATIVE_FORCE_REFRESH \
            NEGATIVE_GET_STRING_VALUE NEGATIVE_GET_BOOL_VALUE NEGATIVE_GET_INT_VALUE NEGATIVE_GET_DOUBLE_VALUE \
            NEGATIVE_GET_STRING_VALUE_DETAILS NEGATIVE_GET_BOOL_VALUE_DETAILS \
            NEGATIVE_GET_INT_VALUE_DETAILS NEGATIVE_GET_DOUBLE_VALUE_DETAILS; do
            check_negative "$flag (client)" -D NEGATIVE_CALLBACK -D "$flag"
            check_negative "$flag (protocol)" -D NEGATIVE_CALLBACK -D "$flag" -D TARGET_PROTOCOL
          done

  test-thread-sanitizer:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Tests with Thread Sanitizer
        run: |
          xcodebuild test \
            -project ConfigCat.xcodeproj \
            -scheme "ConfigCat" \
            -destination 'platform=macOS,arch=x86_64' \
            -enableThreadSanitizer YES \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath ThreadSanitizer.xcresult
      - name: Archive results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: thread-sanitizer-results
          path: ThreadSanitizer.xcresult

  coverage:
    needs: [test-ios, test-osx, test-swift-6, test-thread-sanitizer]
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - sdk: macosx15.5
            destination: arch=x86_64
    steps:
      - uses: actions/checkout@v7

      - name: Install Slather
        run: |
          gem install slather --version 2.8.5
          brew install sonar-scanner

      - name: Execute Coverage
        run: |
          set -o pipefail
          xcodebuild build-for-testing -sdk ${{ matrix.sdk }} -project ConfigCat.xcodeproj -scheme "ConfigCat Coverage" -destination "${{ matrix.destination }}" -quiet
          xcodebuild test-without-building -sdk ${{ matrix.sdk }} -project ConfigCat.xcodeproj -scheme "ConfigCat Coverage" -destination "${{ matrix.destination }}" -quiet
          slather

      - name: Run Sonar
        run: |
          git fetch --unshallow --no-tags
          sonar-scanner -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pod-lint:
    needs: coverage
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install Cocoapods
        run: gem install cocoapods

      - name: Lint
        run: pod lib lint

  publish:
    needs: pod-lint
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags')
    steps:
      - uses: actions/checkout@v7

      - name: Install Cocoapods
        run: gem install cocoapods

      - name: Publish
        run: pod trunk push
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
